<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.A.R.E</title>
    <style>
        /* 1. DEFAULT THEME (Night/Dark Mode) */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            transition: background 0.3s, color 0.3s;
        }

        /* Continuous invisible hover trigger zone at the very top of the window */
        .header-trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            z-index: 999;
        }

        /* Updated header layout to dynamically adjust document height */
        header {
            background-color: #262621;
            color: white;
            padding: 26px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            overflow: hidden;
            opacity: 0;
            transition: background 0.3s, max-height 0.3s ease-in-out, padding 0.3s ease-in-out, opacity 0.2s ease-in-out;
        }

        /* Expands header and dynamic padding when triggering zone OR the header itself is hovered */
        .header-trigger:hover + header,
        header:hover {
            max-height: 100px;
            padding: 26px;
            opacity: 1;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            grid-column: 2;
            text-align: center;
            cursor: pointer; /* Makes logo clickable back to home */
        }

        /* Positions navigation links cleanly on the far left */
        nav {
            display: flex;
            align-items: center;
            gap: 15px;
            grid-column: 1;
            grid-row: 1;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
            cursor: pointer;
        }

        nav a:hover, nav a.active {
            text-decoration: underline;
        }

        /* Positions clock and toggle cleanly on the far right */
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
            grid-column: 3;
            justify-content: flex-end;
        }

        #live-clock {
            color: white;
            font-size: 18px;
            font-weight: bold;
            background-color: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* Theme Toggle Button Style */
        #theme-toggle {
            background-color: rgba(255,255,255,0.15);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        #theme-toggle:hover {
            background-color: rgba(255,255,255,0.3);
        }

        /* 2. ALTERNATE THEME (Light Mode Styles) */
        body.light-mode {
            background-color: #f5f7fa;
            color: #333333;
        }

        body.light-mode header {
            background-color: #537FCB;
        }

        body.light-mode #theme-toggle {
            background-color: rgba(0,0,0,0.1);
            color: white;
        }

        /* Views management layout setup */
        .page-view {
            padding: 20px;
            display: none; /* Hides views by default */
        }

        .page-view.active-view {
            display: block; /* Shows only the active view */
        }

        .add-square {
            width: 120px;
            height: 120px;
            background-color: #537FCB;
            color: white;
            font-size: 50px;
            font-weight: normal;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, background-color 0.3s;
            margin-top: 10px;
        }

        .add-square:hover {
            transform: scale(1.05);
            background-color: #3867B8;
        }

        body.light-mode .add-square {
            background-color: #2c3e50;
        }

        body.light-mode .add-square:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>

    <!-- Invisible trigger area placed directly above the header structure -->
    <div class="header-trigger"></div>

    <!-- Semantic HTML Header Component -->
    <header>
        <!-- Left Side: Navigation Links -->
        <nav>
            <a id="nav-home" class="active">Home</a>
            <a id="nav-create">Create</a>
        </nav>

        <!-- Center: Brand Logo -->
        <div class="logo" id="logo-home">C.A.R.E</div>

        <!-- Right Side: Utility Items -->
        <div class="header-right">
            <div id="live-clock"></div>
            <button id="theme-toggle">☀️ Light</button>
        </div>
    </header>

    <!-- HOME PAGE VIEW -->
    <main id="home-view" class="page-view active-view">
        <button class="add-square" id="add-btn">+</button>
    </main>

    <!-- NEW CREATE PAGE VIEW -->
    <main id="create-view" class="page-view">
        <h2>Create Something New</h2>
        <p>This is your inner create page workspace area!</p>
        <!-- You can place your forms or creation tools right here -->
    </main>

    <script>
        // --- 1. Clock Logic ---
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // --- 2. Theme Toggle Logic ---
        const toggleBtn = document.getElementById('theme-toggle');
        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                toggleBtn.textContent = '🌙 Night';
            } else {
                toggleBtn.textContent = '☀️ Light';
            }
        });

        // --- 3. Single Page Navigation Logic ---
        const homeView = document.getElementById('home-view');
        const createView = document.getElementById('create-view');
        
        const navHome = document.getElementById('nav-home');
        const navCreate = document.getElementById('nav-create');
        const logoHome = document.getElementById('logo-home');
        const addBtn = document.getElementById('add-btn');

        // Function to switch visible layout screens
        function showPage(page) {
            if (page === 'home') {
                homeView.classList.add('active-view');
                createView.classList.remove('active-view');
                navHome.classList.add('active');
                navCreate.classList.remove('active');
            } else if (page === 'create') {
                createView.classList.add('active-view');
                homeView.classList.remove('active-view');
                navCreate.classList.add('active');
                navHome.classList.remove('active');
            }
        }

        // Event listeners triggering our screen swaps
        navHome.addEventListener('click', () => showPage('home'));
        logoHome.addEventListener('click', () => showPage('home'));
        navCreate.addEventListener('click', () => showPage('create'));
        addBtn.addEventListener('click', () => showPage('create'));
    </script>
</body>
</html>
