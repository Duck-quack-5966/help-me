<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Top Header Example</title> 
    <style> 
        /* 1. Remove default browser margins */ 
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
        } 
        /* 2. Style the top header container */ 
        header { 
            background-color: #1abc9c; 
            color: white; 
            padding: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        } 
        /* 3. Style content inside the header */ 
        .logo { 
            font-size: 24px; 
            font-weight: bold; 
        } 

        /* FIX: Added a right-side wrapper container to align nav and clock together */
        .header-right {
            display: flex;
            align-items: center;
            gap: 5px; /* Controls the exact space between the Home link and the clock */
        }

        /* FIX: Removed left margin since the parent gap property handles spacing now */
        nav a { 
            color: white; 
            text-decoration: none; 
        } 
        nav a:hover { 
            text-decoration: underline; 
        } 

        #live-clock { 
            color: white; 
            font-size: 18px; 
            font-weight: bold; 
            background-color: rgba(0,0,0,0.1); 
            padding: 5px 15px; 
            border-radius: 20px; 
        } 
    </style> 
</head> 
<body> 
    <!-- Semantic HTML Header Component --> 
    <header> 
        <!-- Left Item -->
        <div class="logo">C.A.R.E</div> 
        
        <!-- Right Items Wrapper Component --> 
        <div class="header-right">
            <nav> 
                <a href="#home">Home</a> 
                <a href="#home">Create</a>
            </nav> 
            <div id="live-clock"></div> 
        </div>
    </header> 

    <script> 
        function updateClock() { 
            const now = new Date(); 
            const hours = String(now.getHours()).padStart(2, '0'); 
            const minutes = String(now.getMinutes()).padStart(2, '0'); 
            const seconds = String(now.getSeconds()).padStart(2, '0'); 
            document.getElementById('live-clock').textContent = `${hours}:${minutes}:${seconds}`; 
        } 
        updateClock(); 
        setInterval(updateClock, 1000); 
    </script> 

    <main style="padding: 20px;"> 
        <h2>Welcome to the site</h2> 
        <p>Your main website content goes here...</p> 
    </main> 
</body> 
</html>
