<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARE — Home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Modak&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="nav.css">
  <link rel="stylesheet" href="font.css">
  <link rel="stylesheet" href="css/home.css">

  <script defer src="nav.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/home.js"></script>
</head>

<body>

<nav>
  <!-- Mobile Sidebar -->
  <ul class="sidebar">
    <li onclick="hideSidebar()">
      <a href="#">
        <button class="close-button">&times;</button>
      </a>
    </li>

    <li><a href="index.html">Home</a></li>
    <li><a href="create.html">Create</a></li>

    <li class="clock-mobile">
      <span id="live-clock-mobile"></span>
    </li>
  </ul>

  <!-- Desktop Navigation -->
  <ul class="main-menu">
    <!-- Left -->
    <li class="hideOnMobile"><a href="index.html">Home</a></li>
    <li class="hideOnMobile"><a href="create.html">Create</a></li>

    <!-- Center -->
    <li class="logo hideOnMobile">
      <a href="index.html">C.A.R.E</a>
    </li>

    <!-- Right -->
    <li class="clock hideOnMobile">
      <span id="live-clock"></span>
    </li>

   <li class="theme-toggle" onclick="toggleTheme()">
    <span id="theme-icon">☀️</span>
    </li>

    <li class="menu-button" onclick="showSidebar()">
      <a href="#">
        <svg viewBox="0 0 24 24">
          <path d="M4 6h16M4 12h16M4 18h16"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                fill="none"/>
        </svg>
      </a>
    </li>
  </ul>
</nav>

<!-- ================= HOME PAGE / PROJECT DASHBOARD ================= -->

<main id="home-view" class="page-view active-view">

  <div class="home-header">
    <h1>CARE Dashboard</h1>
    <p>Ceramic Artifact Reserve and Enclosure — your monitored projects</p>
  </div>

  <p id="empty-state">No projects yet. Click the "+" button to create your first project.</p>

  <div id="project-container">

    <!-- Project cards are inserted here automatically by js/home.js -->

    <!-- Create New Project Button (always stays last) -->
    <a href="create.html" id="add-link">
      <button class="add-square" id="add-btn" type="button" title="Create new project">+</button>
    </a>
  </div>

</main>

</body>
</html>
