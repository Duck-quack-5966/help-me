<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>C.A.R.E</title> 
    <style> 
        /* 1. DEFAULT THEME (Night/Dark Mode) */ 
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            transition: background 0.3s, color 0.3s; /* Smooth color switching animation */ 
        } 
        header { 
            background-color: #262621; 
            color: white; 
            padding: 26px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: background 0.3s; 
        } 
        .logo { 
            font-size: 24px; 
            font-weight: bold; 
        } 
        .header-right { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        } 

        /* FIX: Made the nav a flex container to precisely separate internal links */
        nav { 
            display: flex;
            align-items: center;
            gap: 15px; /* Adjust this number higher to push Home and Create further apart */
        } 
        nav a { 
            color: white; 
            text-decoration: none; 
            font-size: 16px; 
            transition: color 0.3s; 
        } 
        nav a:hover { 
            text-decoration: underline; 
        } 
        #live-clock { 
            color: white; 
            font-size: 18px; 
            font-weight: bold; 
            background-color: rgba(255,255,255,0.1); 
            padding: 5px 15px; 
            border-radius: 20px; 
        } 
        /* Theme Toggle Button Style */ 
        #theme-toggle { 
            background-color: rgba(255,255,255,0.15); 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px; 
        } 
        #theme-toggle:hover { 
            background-color: rgba(255,255,255,0.3); 
        } 
        /* 2. ALTERNATE THEME (Light Mode Styles) */ 
        body.light-mode { 
            background-color: #f5f7fa; 
            color: #333333; 
        } 
        body.light-mode header { 
            background-color: #537FCB; /* Keeps header vibrant or you can change it to white */ 
        } 
        body.light-mode #theme-toggle { 
            background-color: rgba(0,0,0,0.1); 
            color: white; 
        } 
        .add-square {
            width: 120px;
            height: 120px;
            background-color: #537FCB; /* Matches teal design color theme */
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px; /* Slightly rounded edges, set to 0px for a sharp square */
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, background-color 0.3s;
            margin-top: 10px; /* Pushes it down slightly away from the header boundary */
        }
        .add-square:hover {
            transform: scale(1.05); /* Slight pop effect on hover */
            background-color: #16a085; /* Darker teal highlight */
        }

        /* 2. ALTERNATE THEME (Light Mode Styles) */ 
        body.light-mode { 
            background-color: #537FCB; 
            color: #333333; 
        } 
        body.light-mode header { 
            background-color: #1abc9c; 
        } 
        body.light-mode #theme-toggle { 
            background-color: rgba(0,0,0,0.1); 
            color: white; 
        }
        /* Style shift for the square button context in light mode */
        body.light-mode .add-square {
            background-color: #2c3e50; /* Dark slate button contrast for light mode */
        }
        body.light-mode .add-square:hover {
            background-color: #34495e;
        }
    </style> 
</head> 
<body> 
    <!-- Semantic HTML Header Component --> 
    <header> 
        <div class="logo">C.A.R.E</div> 
        <div class="header-right"> 
            <nav> 
                <a href="#home">Home</a> 
                <a href="#home">Create</a> 
            </nav> 
            <div id="live-clock"></div> 
            <!-- Added Toggle Button --> 
            <button id="theme-toggle">☀️ Light</button> 
        </div> 
    </header> 
    <main style="padding: 20px;"> 
         <!-- Square Button added below -->
        <button class="add-square"> +</button> 
    </main> 
    <script> 
        // --- 1. Clock Logic --- 
        function updateClock() { 
            const now = new Date(); 
            const hours = String(now.getHours()).padStart(2, '0'); 
            const minutes = String(now.getMinutes()).padStart(2, '0'); 
            const seconds = String(now.getSeconds()).padStart(2, '0'); 
            document.getElementById('live-clock').textContent = `${hours}:${minutes}:${seconds}`; 
        } 
        updateClock(); 
        setInterval(updateClock, 1000); 

        // --- 2. Theme Toggle Logic --- 
        const toggleBtn = document.getElementById('theme-toggle'); 
        toggleBtn.addEventListener('click', () => { 
            // Toggles the .light-mode class on the <body> tag 
            document.body.classList.toggle('light-mode'); 
            // Updates button text based on current theme state 
            if (document.body.classList.contains('light-mode')) { 
                toggleBtn.textContent = '🌙 Night'; 
            } else { 
                toggleBtn.textContent = '☀️ Light'; 
            } 
        }); 
    </script> 
</body> 
</html>
